<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marathon Build — 11 October</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#E4E7E9; --card:#FAFBFB; --card2:#F0F3F4;
  --ink:#131C22; --soft:#63737D; --faint:#8D9AA2; --rule:#CBD2D6;
  --z1:#6E9DC2; --z2:#2F7F60; --z3:#B98A22; --z4:#B34E1C; --z5:#8E2521;
  --rest:#A7B0B5; --flag:#8E2521;
  --shadow:0 1px 2px rgba(19,28,34,.06),0 4px 14px rgba(19,28,34,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 72px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:'Barlow Condensed','IBM Plex Sans',sans-serif}

/* ---------- hero ---------- */
.hero{padding:34px 0 22px;border-bottom:2px solid var(--ink)}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--soft);margin:0 0 6px
}
.count{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.count .n{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(76px,20vw,132px);line-height:.82;letter-spacing:-.02em
}
.count .lbl{font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:clamp(19px,4.4vw,26px);line-height:1.05;text-transform:uppercase;
  letter-spacing:.03em;padding-bottom:8px;max-width:190px}
.count .lbl small{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;font-weight:400;letter-spacing:.12em;color:var(--soft);
  text-transform:uppercase;margin-top:5px}
.targets{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px}
.targ{border-left:2px solid var(--rule);padding-left:11px}
.targ b{display:block;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600}
.targ span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--soft)}

/* ---------- progress ---------- */
.prog{margin-top:20px}
.prog-bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--z2);width:0;
  transition:width .45s cubic-bezier(.2,.7,.3,1)}
.prog-txt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);margin-top:7px;display:flex;
  justify-content:space-between;gap:10px}
.reset{background:none;border:none;color:var(--faint);font:inherit;font-size:10.5px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--flag)}

/* ---------- tabs ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin-top:4px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--soft);
  padding:13px 13px 10px;cursor:pointer;white-space:nowrap;margin-bottom:-1px
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--z4);outline-offset:-3px}

/* ---------- week card ---------- */
.week{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  margin-top:16px;box-shadow:var(--shadow);overflow:hidden}
.week.peak{border-color:var(--z4);border-width:1.5px}
.wk-head{padding:15px 16px 13px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wk-head h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:25px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.wk-head .dates{font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:5px}
.wk-out{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--soft);text-align:right;white-space:nowrap;flex-shrink:0}
.wk-out b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;
  font-weight:700;letter-spacing:0;color:var(--ink);line-height:1}
.tagline{padding:9px 16px;background:var(--card2);border-bottom:1px solid var(--rule);
  font-size:13px;color:var(--soft)}
.tagline b{color:var(--ink);font-weight:600}

/* signature: intensity load strip */
.strip{display:flex;height:9px;gap:1.5px;padding:11px 16px 0}
.strip i{display:block;border-radius:1px;min-width:2px}
.strip-key{padding:6px 16px 12px;display:flex;gap:11px;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint)}
.strip-key span{display:flex;align-items:center;gap:4px}
.strip-key b{width:7px;height:7px;border-radius:1px;display:block}

/* ---------- sessions ---------- */
.sess{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);
  cursor:pointer;align-items:flex-start;transition:background .12s}
.sess:hover{background:var(--card2)}
.sess.on{background:#EEF3F0}
.sess.on .body{opacity:.5}
.sess.on .title{text-decoration:line-through;text-decoration-thickness:1px}
.box{flex-shrink:0;width:19px;height:19px;border:1.5px solid var(--rule);
  border-radius:2px;background:#fff;margin-top:2px;position:relative;transition:.14s}
.sess.on .box{background:var(--z2);border-color:var(--z2)}
.box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg) scale(0);
  transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
.sess.on .box::after{transform:rotate(43deg) scale(1)}
.day{flex-shrink:0;width:34px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);
  margin-top:3px;border-left:2.5px solid var(--rest);padding-left:7px}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:14.5px;line-height:1.35}
.title .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;
  vertical-align:2px;margin-left:6px;color:#fff}
.detail{font-size:13px;color:var(--soft);margin-top:3px}
.hr{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  border-left:2px solid var(--rule);padding-left:8px}
.hr b{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap}
.hr b::before{content:"♥ ";font-size:10px;vertical-align:1px;color:var(--flag)}
.hr span{font-size:12px;color:var(--faint);line-height:1.4}
.note{margin-top:7px;width:100%;font-size:12.5px;font-family:'IBM Plex Mono',monospace;
  padding:5px 7px;border:1px dashed var(--rule);border-radius:2px;background:transparent;color:var(--ink)}
.note::placeholder{color:#AEB8BE}
.note:focus{outline:none;border-style:solid;border-color:var(--z4);background:#fff}
select.daysel{-webkit-appearance:none;appearance:none;background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--soft);border:none;border-left:2.5px solid var(--rest);
  padding:0 0 0 7px;margin-top:3px;width:44px;flex-shrink:0;cursor:pointer;border-radius:0}
select.daysel:focus{outline:2px solid var(--z4);outline-offset:2px}
.detail em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink)}

/* ---------- generic content ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  margin-top:16px;box-shadow:var(--shadow);overflow:hidden}
.panel > h3{margin:0;padding:14px 16px 12px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;
  border-bottom:1px solid var(--rule);background:var(--card2)}
.pc{padding:15px 16px}
.pc + .pc{border-top:1px solid var(--rule)}
.pc h4{margin:0 0 7px;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.pc p{margin:0 0 9px}
.pc p:last-child{margin-bottom:0}
.pc ul{margin:0 0 9px;padding-left:19px}
.pc ul:last-child{margin-bottom:0}
.pc li{margin-bottom:5px}
.pc li:last-child{margin-bottom:0}
.k{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
  background:var(--card2);padding:1px 5px;border-radius:2px;white-space:nowrap}
.rule-hi{border-left:3px solid var(--flag);padding:11px 13px;background:#FBF3F2;
  border-radius:0 2px 2px 0;font-size:13.5px}
.rule-hi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:15px;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--flag)}
.note{border-left:3px solid var(--z2);padding:11px 13px;background:#F1F6F3;
  border-radius:0 2px 2px 0;font-size:13.5px}
.note b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:15px;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--z2)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--soft);font-weight:500;
  padding:0 8px 6px 0;border-bottom:1px solid var(--rule)}
td{padding:7px 8px 7px 0;border-bottom:1px solid #E4E9EB;vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- log ---------- */
.log-row{display:grid;grid-template-columns:1fr 78px 74px;gap:8px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--rule)}
.log-row:first-of-type{border-top:none}
.log-row .lr-name{font-size:13.5px;font-weight:600;line-height:1.25}
.log-row .lr-name small{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:400;color:var(--soft);letter-spacing:.06em;
  text-transform:uppercase;margin-top:2px}
input[type=text]{width:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;
  padding:7px 8px;border:1px solid var(--rule);border-radius:2px;background:#fff;
  color:var(--ink);min-width:0}
input[type=text]:focus{outline:2px solid var(--z4);outline-offset:-1px;border-color:var(--z4)}
.log-head{display:grid;grid-template-columns:1fr 78px 74px;gap:8px;padding:10px 16px 6px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--rule)}

.saving{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--ink);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;padding:8px 15px;border-radius:3px;
  transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:60;pointer-events:none}
.saving.show{transform:translateX(-50%) translateY(0)}
.saving.err{background:var(--flag)}

/* ---- dashboard ---- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px}
.stats>div{border-left:2px solid var(--rule);padding-left:10px}
.stats b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;line-height:1.05}
.stats span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--soft)}
/* ---- week bar ---- */
.wkbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--soft);flex-wrap:wrap}
.wkbar i{flex:1;min-width:70px;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.wkbar u{display:block;height:100%;text-decoration:none}
button.ghost{background:none;border:1px solid var(--rule);border-radius:2px;color:var(--soft);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;cursor:pointer}
button.ghost:hover{border-color:var(--flag);color:var(--flag)}
/* ---- advisories ---- */
.adv{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:13.5px;
  border-left:3px solid var(--z3);background:#FCF8EF}
.adv.warn{border-left-color:var(--flag);background:#FBF3F2}
.adv p{margin:0}
.adv-btn{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.adv-btn button{background:var(--ink);color:#fff;border:none;border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 10px;cursor:pointer}
.adv-btn button.ghost{background:none;color:var(--soft);border:1px solid var(--rule)}
/* ---- log box ---- */
.sessw{border-top:1px solid var(--rule)}
.sessw .sess{border-top:none}
button.exp{flex-shrink:0;align-self:flex-start;background:none;border:1px solid var(--rule);
  border-radius:2px;width:26px;height:26px;font-size:15px;line-height:1;color:var(--soft);
  cursor:pointer;margin-top:1px}
.logbox{padding:0 16px 14px 60px;background:var(--card2)}
.logbox.shut{display:none}
.pa{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--soft);padding:10px 0 8px}
.pa em{font-style:normal;color:var(--flag)}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.fields.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:430px){.fields.four{grid-template-columns:repeat(2,1fr)}}
.fields label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--soft);display:block}
.fields input{width:100%;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  padding:6px 7px;border:1px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink)}
.modes{display:flex;gap:6px;margin-top:9px}
.modes button{flex:1;background:#fff;border:1px solid var(--rule);border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 0;color:var(--soft);cursor:pointer}
.modes button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.feel{display:flex;gap:6px;margin-top:6px}
.feel button{flex:1;background:#fff;border:1px solid var(--rule);border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 0;color:var(--soft);cursor:pointer}
.feel button.on{background:var(--z2);border-color:var(--z2);color:#fff}
.note-b{border-left:3px solid var(--z2);padding:11px 13px;background:#F1F6F3;
  border-radius:0 2px 2px 0;font-size:13.5px;margin-bottom:12px}
.note-b b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:15px;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--z2)}
@media (max-width:520px){ .logbox{padding-left:16px} }

.dbtn{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.dbtn button{background:var(--ink);color:#fff;border:none;border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;cursor:pointer}
.dbtn button.ghost{background:none;color:var(--soft);border:1px solid var(--rule)}
#dataBox{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;
  padding:9px;border:1px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink);resize:vertical}
#dataBox:focus{outline:2px solid var(--z4);outline-offset:-1px}
.yg{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.yg b{width:7px;height:7px;border-radius:50%;display:block;flex-shrink:0}
.ylist{margin:0;padding:0;list-style:none}
.ylist li{border-top:1px solid #EAEEEF}
.ylist li:first-child{border-top:none}
.ylist a{display:block;padding:9px 16px;color:var(--ink);text-decoration:none;font-size:13.5px}
.ylist a:hover{background:var(--card2);text-decoration:underline}
.ylist a.p::before{content:"\2605  ";color:var(--z3)}
.ycount{float:right;font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75}
.hidden{display:none}
@media (max-width:520px){
  .day{width:30px;font-size:10px}
  .log-row,.log-head{grid-template-columns:1fr 66px 64px;gap:6px}
  .targets{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <header class="hero">
    <p class="eyebrow">Marathon build · Plovdiv</p>
    <div class="count">
      <div class="n mono" id="days">—</div>
      <div class="lbl">Days to<br>the start line<small id="racedate">Sunday 11 October 2026</small></div>
    </div>
    <div class="targets">
      <div class="targ"><b>4:50:00</b><span>Target finish</span></div>
      <div class="targ"><b>6:45–6:50</b><span>Race pace /km</span></div>
      <div class="targ"><b>158–166</b><span>Race HR bpm</span></div>
      <div class="targ"><b>210 / 182</b><span>HRmax / LTHR</span></div>
    </div>
    <div class="prog">
      <div class="prog-bar"><i id="pbar"></i></div>
      <div class="prog-txt">
        <span id="ptxt">Loading…</span>
        <span id="storemode" style="color:var(--faint)"></span>
        <button class="reset" id="reset">Clear all ticks</button>
      </div>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="plan">Plan</button>
    <button role="tab" aria-selected="false" data-tab="fuel">Fuel</button>
    <button role="tab" aria-selected="false" data-tab="recovery">Recovery</button>
    <button role="tab" aria-selected="false" data-tab="raceday">Race day</button>
    <button role="tab" aria-selected="false" data-tab="strength">Strength</button>
    <button role="tab" aria-selected="false" data-tab="yoga">Yoga</button>
    <button role="tab" aria-selected="false" data-tab="log">Log</button>
  </nav>

  <section id="tab-plan"></section>
  <section id="tab-fuel" class="hidden"></section>
  <section id="tab-recovery" class="hidden"></section>
  <section id="tab-raceday" class="hidden"></section>
  <section id="tab-strength" class="hidden"></section>
  <section id="tab-yoga" class="hidden"></section>
  <section id="tab-log" class="hidden"></section>
</div>

<template id="zonesrc"><div class="panel"><h3>Heart rate zones · HRmax 210 · LTHR 182</h3>
   <div class="pc" style="padding-bottom:8px">
    <table>
     <tr><th style="width:8px"></th><th>Zone</th><th>BPM</th><th>% max</th><th>What it is for</th></tr>
     <tr><td style="background:var(--z1);border-radius:2px"></td><td><b>Recovery</b></td><td class="num">&lt;148</td><td class="num">&lt;70%</td><td>Shakeouts, the day after a long run</td></tr>
     <tr><td style="background:var(--z2);border-radius:2px"></td><td><b>Easy</b></td><td class="num">148–160</td><td class="num">70–76%</td><td>Long runs and every easy run — 80% of the plan</td></tr>
     <tr><td style="background:var(--z3);border-radius:2px"></td><td><b>Marathon</b></td><td class="num">158–168</td><td class="num">75–80%</td><td>Race effort and race-pace blocks</td></tr>
     <tr><td style="background:var(--z4);border-radius:2px"></td><td><b>Threshold</b></td><td class="num">172–182</td><td class="num">82–87%</td><td>Tuesday intervals in Weeks 3 and 6</td></tr>
     <tr><td style="background:var(--z5);border-radius:2px"></td><td><b>Hard</b></td><td class="num">183–195</td><td class="num">87–93%</td><td>The Norwegian session, once, on 22 Sep</td></tr>
    </table>
   </div>
   <div class="pc">
    <h4>Four rules for reading the number</h4>
    <ul>
     <li><b>Cardiac drift is normal.</b> HR climbs 5–10 bpm over two hours at identical pace. Set your target on the <b>first half</b> of a long run and let the second half drift within the ceiling.</li>
     <li><b>Heat adds 10–15 bpm</b> at the same pace. Above 25 °C, obey the heart rate and let the pace go entirely.</li>
     <li><b>Run-walk to hold the running HR down</b>, never to average it down. A pre-set 9:1 or 4:1 that keeps the <em>running</em> segments in zone is real easy running. Sprinting then recovering to a nice mean is not.</li>
     <li><b>Check the sensor before you trust it.</b> Several of your easy runs show spikes to 200+ while averaging 167 — almost certainly wrist-optical cadence lock. Confirm with a chest strap before restructuring a session around one reading.</li>
    </ul>
    <div class="note-b"><b>Time, not distance</b>Every easy run is a duration — run 45 minutes, stop, go home. Long runs carry a distance for rehearsal purposes but the elapsed-time cap overrules it. Only the race-pace blocks are fixed distances, because those are measurements. Always log <b>elapsed</b> time.</div>
    <div class="rule-hi"><b>The morning check</b>Resting HR 7+ bpm above your normal means the session becomes a rest day. That is not weakness — it is the single most reliable early warning you have, and it is free.</div>

/* ---------------- rendering ---------------- */
function esc(s){return s;}

/* ================= engine ================= */
function pmin(v){
  if(v==null) return 0; v=String(v).trim(); if(!v) return 0;
  const p=v.replace(/[.,]/g,':').split(':').map(Number); if(p.some(x=>isNaN(x))) return 0;
  if(p.length===1) return p[0];
  if(p.length===3) return p[0]*60+p[1]+p[2]/60;
  return p[0]>=10 ? p[0]+p[1]/60 : p[0]*60+p[1];
}
function fmt(m){ m=Math.round(m); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
function sid(w,i){ return w.id+'-'+i; }
function plannedMin(w,i){ const id=sid(w,i); return (state.ov[id]&&state.ov[id].capMin)||w.s[i].min; }
function sessDate(w,i){
  const base=new Date(w.start+'T12:00:00');
  const d=state.days[sid(w,i)]||w.s[i].d;
  let k=DAYS.indexOf(d);
  if(k<0) k=[1,3,5][i]||2;               // vacation P1/P2/P3 → Tue/Thu/Sat
  base.setDate(base.getDate()+k); return base;
}
function actual(w,i){ return state.act[sid(w,i)]||{}; }
function elMin(a){                       // null = nothing entered; 0 = explicitly zero
  const has=(a.eh!=null&&a.eh!=='')||(a.em!=null&&a.em!=='');
  if(has) return (+a.eh||0)*60 + (+a.em||0);
  if(a.el!=null&&String(a.el).trim()!=='') return pmin(a.el);
  return null;
}
function doneMin(w,i){
  const a=actual(w,i);
  if(a.mode==='other'||a.mode==='skip') return 0;   // cross-training or skipped: no running load
  const t=elMin(a);
  if(t!==null) return t;
  return state.checks[sid(w,i)] ? plannedMin(w,i) : 0;
}
function allSessions(){
  const out=[];
  WEEKS.forEach(w=>w.s.forEach((x,i)=>{ if(x.min>0) out.push({w,i,x,id:sid(w,i),date:sessDate(w,i)}); }));
  return out;
}
function loadStats(){
  const now=new Date(), day=864e5, list=allSessions();
  const since=n=>list.filter(o=>(now-o.date)>=0 && (now-o.date)<n*day);
  const wsum=arr=>arr.reduce((t,o)=>t+doneMin(o.w,o.i)*(ZW[o.x.z]||1),0);
  const rsum=arr=>arr.reduce((t,o)=>t+doneMin(o.w,o.i),0);
  const acute=rsum(since(7)), chronic=rsum(since(28))/4;      // raw time, for display
  const wa=wsum(since(7)), wc=wsum(since(28))/4;              // weighted, for the ratio
  const long21=since(21).filter(o=>o.x.min>=60).reduce((m,o)=>Math.max(m,doneMin(o.w,o.i)),0);
  const logged=since(28).filter(o=>doneMin(o.w,o.i)>0).length;
  return {acute,chronic,ratio:wc>0?wa/wc:0,wa,wc,long21,logged};
}
function nextLong(){
  const now=new Date();
  return allSessions().filter(o=>o.x.min>=120 && o.date>=now-864e5).sort((a,b)=>a.date-b.date)[0];
}

/* ---- rules ---- */
function advisories(w){
  const out=[], now=new Date(), st=loadStats();
  const wi=WEEKS.indexOf(w), end=new Date(w.start+'T12:00:00'); end.setDate(end.getDate()+6);
  const past=end<now;
  const key=k=>w.id+':'+k;
  const live=k=>!state.dis[key(k)];

  // R1 — week overshoot
  const pl=w.s.reduce((t,x,i)=>t+plannedMin(w,i),0);
  const ac=w.s.reduce((t,x,i)=>t+doneMin(w,i),0);
  if(past && pl>0 && ac>pl*1.15 && live('R1'))
    out.push({k:'R1',lvl:'info',t:`This week ran ${Math.round((ac/pl-1)*100)}% over plan (${fmt(ac)} vs ${fmt(pl)}). Feeling fine during isn't the signal — if the next 48 h are heavy, drop Thursday.`});

  // R2 — acute:chronic
  if(wi===WEEKS.findIndex(x=>new Date(x.start+'T12:00:00')<=now && new Date(x.start+'T12:00:00')>new Date(now-7*864e5))){
    if(st.logged>=8 && st.chronic>0){
      if(st.ratio>1.3 && live('R2'))
        out.push({k:'R2',lvl:'warn',t:`Load ratio ${st.ratio.toFixed(2)} — you're ramping faster than your body has adapted to. Above 1.3 is where injuries cluster. Hold this week flat.`});
      else if(st.ratio<0.8 && live('R2b'))
        out.push({k:'R2b',lvl:'info',t:`Load ratio ${st.ratio.toFixed(2)} — running below your recent average. Fine after a hard week; worth noticing if it repeats.`});
    }
  }

  // R3 — next long run too big a jump
  const nl=nextLong();
  if(nl && nl.w===w && st.long21>0 && live('R3')){
    const cap=plannedMin(nl.w,nl.i);
    if(cap>st.long21*1.15 && !LOCKED[nl.id] && sessDate(nl.w,nl.i)<new Date('2026-09-28'))
      out.push({k:'R3',lvl:'warn',t:`${nl.x.t} is ${Math.round((cap/st.long21-1)*100)}% longer than anything in the last 21 days (${fmt(st.long21)}).`,
        act:{label:`Cap at ${fmt(st.long21*1.15)}`, id:nl.id, capMin:Math.round(st.long21*1.15), why:'capped after a 21-day gap'}});
  }

  // R4 — quality too close to the long run
  const longIdx=w.s.findIndex(x=>x.min>=120);
  if(longIdx>=0){
    const ld=sessDate(w,longIdx);
    w.s.forEach((x,i)=>{
      if(i===longIdx||!(x.z==='z4'||x.z==='z5')) return;
      const gap=(ld-sessDate(w,i))/36e5;
      if(gap>0 && gap<48 && live('R4'+i))
        out.push({k:'R4'+i,lvl:'warn',t:`${x.t} sits only ${Math.round(gap)} h before the long run. Move it earlier — hard work inside 48 h costs you the session that matters.`});
    });
  }

  // R5 — long run missed or cut short
  w.s.forEach((x,i)=>{
    if(x.min<120) return;
    const d=sessDate(w,i); if(d>=now) return;
    const got=doneMin(w,i), planned=plannedMin(w,i);
    if(got>0 && got<planned*0.75 && live('R5'+i)){
      const n2=nextLong();
      if(n2 && !LOCKED[n2.id])
        out.push({k:'R5'+i,lvl:'warn',t:`Long run came in at ${fmt(got)} against ${fmt(planned)} planned. Don't jump back to the full progression next week.`,
          act:{label:`Cap next long at ${fmt(got*1.1)}`, id:n2.id, capMin:Math.round(got*1.1), why:'stepped back after a short long run'}});
    }
    if(got===0 && live('R5m'+i))
      out.push({k:'R5m'+i,lvl:'info',t:`Long run not logged. If it was missed rather than just unrecorded, the next one steps up by 10%, not to the planned figure.`});
  });

  // R7 — taper is one-directional
  if(new Date(w.start+'T12:00:00')>=new Date('2026-09-28') && live('R7'))
    out.push({k:'R7',lvl:'info',t:`Taper. No fitness can be added now, only lost. Every suggestion to do more is wrong from here.`});

  return out;
}

/* ================= render ================= */
function renderPlan(){
  const el=document.getElementById('tab-plan');
  const st=loadStats();
  const ratioTxt = st.logged<8 ? 'Not enough logged yet'
    : st.chronic<=0 ? '—'
    : st.ratio.toFixed(2)+(st.ratio>1.3?' · ramping fast':st.ratio<0.8?' · easing off':' · in range');
  const ratioCol = st.logged<8||st.chronic<=0 ? 'var(--soft)' : st.ratio>1.3?'var(--flag)':st.ratio<0.8?'var(--z3)':'var(--z2)';

  const dash=`<div class="panel"><h3>Where you actually are</h3>
   <div class="pc" style="padding-bottom:12px">
    <div class="stats">
     <div><b>${fmt(st.acute)}</b><span>Last 7 days · time</span></div>
     <div><b>${fmt(st.chronic)}</b><span>28-day avg · time</span></div>
     <div><b style="color:${ratioCol}">${ratioTxt}</b><span>Load ratio</span></div>
     <div><b>${st.long21?fmt(st.long21):'—'}</b><span>Longest, 21 days</span></div>
    </div>
    <p style="font-size:12.5px;color:var(--soft);margin:12px 0 0">The two figures above are raw running time. The load ratio is different — it weights hard sessions more heavily (threshold 1.5×, hard 1.7×), then compares the last 7 days against your 28-day average. Between 0.8 and 1.3 is the zone where you're building without outrunning your own adaptation. It only means anything once you've logged a couple of weeks.</p>
   </div></div>`;

  const zones=document.getElementById('zonesrc').innerHTML;

  el.innerHTML = dash + zones + WEEKS.map(w=>{
    const total=w.s.reduce((a,x,i)=>a+plannedMin(w,i),0)||1;
    const strip=w.s.map((x,i)=>x.min>0?`<i style="flex:${plannedMin(w,i)};background:${Z[x.z].c}"></i>`:'').join('');
    const used=[...new Set(w.s.filter(x=>x.min>0).map(x=>x.z))];
    const key=used.map(z=>`<span><b style="background:${Z[z].c}"></b>${Z[z].n}</span>`).join('');
    const pl=total, ac=w.s.reduce((t,x,i)=>t+doneMin(w,i),0);
    const pct=pl?Math.round(ac/pl*100):0;
    const adv=advisories(w).map(a=>`<div class="adv ${a.lvl}">
        <p>${a.t}</p>
        <div class="adv-btn">
          ${a.act?`<button data-apply="${a.act.id}" data-cap="${a.act.capMin}" data-why="${a.act.why}" data-k="${w.id}:${a.k}">${a.act.label}</button>`:''}
          <button class="ghost" data-dismiss="${w.id}:${a.k}">Dismiss</button>
        </div></div>`).join('');

    const sess=w.s.map((x,i)=>{
      const id=sid(w,i), a=actual(w,i), ov=state.ov[id];
      const tag=x.tag?`<span class="tag" style="background:${Z[x.z].c}">${x.tag}</span>`:'';
      const dayCtrl = w.vac
        ? `<div class="day" style="border-left-color:${Z[x.z].c}">${x.d}</div>`
        : `<select class="day daysel" data-day="${id}" style="border-left-color:${Z[x.z].c}" aria-label="Day">${
            DAYS.map(d=>`<option${d===(state.days[id]||x.d)?' selected':''}>${d}</option>`).join('')}</select>`;
      const open = !!(a.el||a.eh||a.em||a.km||a.hr||a.note||a.mode||state.checks[id]);
      const log = x.min>0 ? `<div class="logbox${open?'':' shut'}" data-box="${id}">
          <div class="pa">Planned <b>${fmt(plannedMin(w,i))}</b>${KM[id]?` · ~${KM[id]} km`:''}${ov?` <em>· ${ov.why}</em>`:''}</div>
          <div class="fields four">
            <label>Hours<input type="text" inputmode="numeric" data-a="${id}.eh" value="${a.eh||''}" placeholder="${Math.floor(plannedMin(w,i)/60)}"></label>
            <label>Mins<input type="text" inputmode="numeric" data-a="${id}.em" value="${a.em||''}" placeholder="${plannedMin(w,i)%60}"></label>
            <label>km<input type="text" inputmode="decimal" data-a="${id}.km" value="${a.km||''}" placeholder="${KM[id]||''}"></label>
            <label>Avg HR<input type="text" inputmode="numeric" data-a="${id}.hr" value="${a.hr||''}" placeholder="bpm"></label>
          </div>
          <div class="modes">${[['ran','ran'],['other','swim / other'],['skip','skipped']].map(([m,l])=>`<button data-mode="${id}.${m}" class="${(a.mode||'ran')===m?'on':''}">${l}</button>`).join('')}</div>
          <div class="feel">${['easy','ok','hard'].map(f=>`<button data-feel="${id}.${f}" class="${a.feel===f?'on':''}">${f}</button>`).join('')}</div>
          <input class="note" type="text" data-a="${id}.note" value="${(a.note||'').replace(/"/g,'&quot;')}" placeholder="notes">
        </div>`:'';
      return `<div class="sessw"><div class="sess" data-id="${id}" role="checkbox" tabindex="0" aria-checked="false">
        <div class="box"></div>${dayCtrl}
        <div class="body">
          <div class="title">${x.t}${tag}${ov?`<span class="tag" style="background:var(--flag)">CAP ${fmt(ov.capMin)}</span>`:''}</div>
          ${x.x?`<div class="detail">${x.x}</div>`:''}
          ${HR[id]?`<div class="hr" style="border-left-color:${Z[x.z].c}"><b>${HR[id][0]}</b><span>${HR[id][1]}</span></div>`:''}
          ${(()=>{const y=yogaFor(w,i);return `<div class="yg"><b style="background:${YCOL[y[0]]}"></b>PM yoga · ${y[1]}</div>`;})()}
        </div>
        ${x.min>0?`<button class="exp" data-exp="${id}" aria-label="Log this session">${open?'−':'+'}</button>`:''}
      </div>${log}</div>`;
    }).join('');

    return `<article class="week${w.peak?' peak':''}">
      <div class="wk-head">
        <div><h2>${w.n}</h2><div class="dates">${w.dates}</div></div>
        <div class="wk-out"><b>${w.out}</b>days out</div>
      </div>
      <div class="tagline">${w.tag}</div>
      <div class="wkbar"><span>${fmt(ac)} logged of ${fmt(pl)} planned</span>
        <i><u style="width:${Math.min(pct,140)/1.4}%;background:${pct>115?'var(--flag)':'var(--z2)'}"></u></i>
        <button class="ghost" data-reset="${w.id}">Reset week</button></div>
      ${adv}
      <div class="strip">${strip}</div>
      <div class="strip-key">${key}</div>
      ${sess}
    </article>`;
  }).join('');

  wire(el);
  paint();
}

function wire(el){
  el.querySelectorAll('.sess').forEach(n=>{
    n.addEventListener('click',e=>{ if(e.target.closest('input,select,button')) return; toggle(n); });
    n.addEventListener('keydown',e=>{ if(e.target.closest('input,select,button')) return;
      if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(n);} });
  });
  el.querySelectorAll('[data-exp]').forEach(b=>b.addEventListener('click',()=>{
    const box=el.querySelector(`[data-box="${b.dataset.exp}"]`);
    const shut=box.classList.toggle('shut'); b.textContent=shut?'+':'−';
  }));
  el.querySelectorAll('select[data-day]').forEach(sel=>sel.addEventListener('change',()=>{
    state.days[sel.dataset.day]=sel.value; save(); renderPlan();
  }));
  el.querySelectorAll('[data-a]').forEach(inp=>inp.addEventListener('input',()=>{
    const j=inp.dataset.a.lastIndexOf('.'), id=inp.dataset.a.slice(0,j), f=inp.dataset.a.slice(j+1);
    state.act[id]=state.act[id]||{}; state.act[id][f]=inp.value; save(); renderLongRuns();
  }));
  el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.mode.lastIndexOf('.'), id=b.dataset.mode.slice(0,i), m=b.dataset.mode.slice(i+1);
    state.act[id]=state.act[id]||{}; state.act[id].mode=m; save(); renderPlan();
  }));
  el.querySelectorAll('[data-feel]').forEach(b=>b.addEventListener('click',()=>{
    const j=b.dataset.feel.lastIndexOf('.'), id=b.dataset.feel.slice(0,j), f=b.dataset.feel.slice(j+1);
    state.act[id]=state.act[id]||{};
    state.act[id].feel = state.act[id].feel===f ? '' : f;
    save(); renderPlan();
  }));
  el.querySelectorAll('[data-apply]').forEach(b=>b.addEventListener('click',()=>{
    state.ov[b.dataset.apply]={capMin:+b.dataset.cap, why:b.dataset.why};
    state.dis[b.dataset.k]=true; save(); renderPlan();
  }));
  el.querySelectorAll('[data-dismiss]').forEach(b=>b.addEventListener('click',()=>{
    state.dis[b.dataset.dismiss]=true; save(); renderPlan();
  }));
  el.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Reset this week to the original plan? Day swaps and caps are cleared. Your logged times and notes are kept.')) return;
    const w=b.dataset.reset;
    Object.keys(state.days).forEach(k=>{ if(k.startsWith(w+'-')) delete state.days[k]; });
    Object.keys(state.ov).forEach(k=>{ if(k.startsWith(w+'-')) delete state.ov[k]; });
    Object.keys(state.dis).forEach(k=>{ if(k.startsWith(w+':')) delete state.dis[k]; });
    save(); renderPlan();
  }));
}

function toggle(n){
  const id = n.dataset.id;
  state.checks[id] = !state.checks[id];
  if(!state.checks[id]) delete state.checks[id];
  save(); renderPlan();
}

function paint(){
  document.querySelectorAll('.sess').forEach(n=>{
    const on = !!state.checks[n.dataset.id];
    n.classList.toggle('on',on);
    n.setAttribute('aria-checked',on?'true':'false');
  });
  const all = WEEKS.reduce((a,w)=>a+w.s.length,0);
  const done = Object.keys(state.checks).length;
  const pct = Math.round(done/all*100);
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('ptxt').textContent = `${done} of ${all} sessions ticked · ${pct}%`;
}

function countdown(){
  const d = Math.max(0, Math.ceil((RACE - new Date())/86400000));
  document.getElementById('days').textContent = d;
}

  <p>Across 4:50 that is roughly <span class="k">330–350 g total</span>. Read the label on your Endurance BG gels and Decathlon jellies and do the division: at ~25–30 g a unit, that is <b>11–13 units</b>.</p>

    const id=sid(w,i), a=actual(w,i), t=elMin(a);

    rows.push({n:x.t, d:sessDate(w,i).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),
      pl:fmt(plannedMin(w,i)), ac:t!==null?fmt(t):'—', km:km?km.toFixed(1):'—',
      hr:a.hr||'—', pace, feel:a.feel||'', done:t!==null});

}

/* ---------------- export / import ---------------- */
function buildSummary(){
  const L=[], st=loadStats();
  L.push('MARATHON TRACKER — export '+new Date().toISOString().slice(0,10));
  L.push('Race: Sun 11 Oct 2026 · target 4:50 · HRmax 210 · LTHR 182');
  L.push('Last 7 days '+fmt(st.acute)+' · 28-day avg '+fmt(st.chronic)+
         ' · load ratio '+(st.chronic>0?st.ratio.toFixed(2):'n/a')+
         ' · longest 21d '+(st.long21?fmt(st.long21):'—'));
  WEEKS.forEach(w=>{
    const rows=[];
    w.s.forEach((x,i)=>{
      const id=sid(w,i), a=actual(w,i), t=elMin(a), ov=state.ov[id];
      const touched = t!==null||a.km||a.hr||a.note||a.mode||state.checks[id];
      if(!touched) return;
      const bits=[];
      bits.push(state.days[id]||x.d);
      bits.push(x.t.replace(/\s+/g,' '));
      bits.push('planned '+fmt(plannedMin(w,i))+(KM[id]?'/'+KM[id]+'km':''));
      if(a.mode&&a.mode!=='ran') bits.push('['+a.mode.toUpperCase()+']');
      if(t!==null) bits.push('actual '+fmt(t));
      else if(state.checks[id]) bits.push('done (no time logged)');
      if(a.km) bits.push(a.km+'km');
      if(a.hr) bits.push(a.hr+'bpm');
      if(a.feel) bits.push('felt '+a.feel);
      if(ov) bits.push('CAP '+fmt(ov.capMin));
      if(a.note) bits.push('"'+a.note+'"');
      rows.push('  '+bits.join(' · '));
    });
    if(!rows.length) return;
    const pl=w.s.reduce((t,x,i)=>t+plannedMin(w,i),0);
    const ac=w.s.reduce((t,x,i)=>t+doneMin(w,i),0);
    L.push('');
    L.push(w.n.toUpperCase()+' ('+w.dates+') — '+fmt(ac)+' logged of '+fmt(pl)+' planned');
    rows.forEach(r=>L.push(r));
  });
  const lg=Object.keys(state.logs).filter(k=>state.logs[k]);
  if(lg.length){ L.push(''); L.push('LOG TAB'); lg.forEach(k=>L.push('  '+k+': '+state.logs[k])); }
  return L.join('\n');
}
function copyOut(text,label){
  const b=document.getElementById('dataBox'); b.value=text;
  const done=okc=>{ document.getElementById('dataMsg').textContent =
    okc ? label+' copied to clipboard.' : 'Select the text above and copy manually.'; };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(()=>done(true),()=>done(false));
    else { b.select(); done(document.execCommand&&document.execCommand('copy')); }
  }catch(e){ done(false); }
}
function initData(){
  const box=document.getElementById('dataBox'), msg=document.getElementById('dataMsg');
  if(!box) return;
  document.getElementById('exSum').addEventListener('click',()=>copyOut(buildSummary(),'Summary'));
  document.getElementById('exRaw').addEventListener('click',()=>copyOut(JSON.stringify(state),'Backup'));
  document.getElementById('imBtn').addEventListener('click',()=>{
    const raw=box.value.trim();
    if(!raw){ msg.textContent='Paste a backup into the box first.'; return; }
    let inc; try{ inc=JSON.parse(raw); }catch(e){ msg.textContent='That is not a valid backup — paste the JSON from "Copy backup".'; return; }
    if(typeof inc!=='object'||inc===null||Array.isArray(inc)){ msg.textContent='That is not a valid backup.'; return; }
    let n=0;
    ['checks','logs','days','notes','ov','dis'].forEach(k=>{
      if(inc[k]&&typeof inc[k]==='object'){ Object.keys(inc[k]).forEach(x=>{ state[k][x]=inc[k][x]; n++; }); }
    });
    if(inc.act&&typeof inc.act==='object') Object.keys(inc.act).forEach(x=>{
      state.act[x]=Object.assign({},state.act[x]||{},inc.act[x]); n++; });
    save(); renderPlan(); msg.textContent='Imported and merged '+n+' entries.'; box.value='';
  });
}

/* ---------------- storage ---------------- */
let saveTimer=null;
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err',!!err); t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600);
}
/* Storage: use Claude's synced storage when running inside Claude,
   fall back to the browser's own storage when the file is opened standalone. */
const STORE = (function(){
  const hasClaude = typeof window!=='undefined' && window.storage
                    && typeof window.storage.get==='function';
  if(hasClaude) return {
    mode:'synced',
    get: async()=>{ const r=await window.storage.get(KEY); return (r&&r.value)||null; },
    set: async v =>{ const r=await window.storage.set(KEY,v); return !!r; }
  };
  let ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    mode: ok?'device':'none',
    get: async()=>{ try{ return localStorage.getItem(KEY); }catch(e){ return null; } },
    set: async v =>{ try{ localStorage.setItem(KEY,v); return true; }catch(e){ return false; } }
  };
})();

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(STORE.mode==='none'){ toast('Private mode — not saved',true); return; }
    try{
      const ok=await STORE.set(JSON.stringify(state));
      toast(ok?'Saved':'Not saved — try again',!ok);
    }catch(e){ toast('Not saved — try again',true); }
  },500);
}
async function load(){
  try{
    const v=await STORE.get();
    if(v) state=Object.assign({checks:{},logs:{},days:{},notes:{},act:{},ov:{},dis:{}},JSON.parse(v));
    ['act','ov','dis','days','logs','checks'].forEach(k=>state[k]=state[k]||{});
    Object.keys(state.notes||{}).forEach(k=>{           // migrate old note field
      if(state.notes[k] && !(state.act[k]&&state.act[k].note)){
        state.act[k]=state.act[k]||{}; state.act[k].note=state.notes[k];
      }});
  }catch(e){ /* first run — nothing stored yet */ }
  renderPlan();
  const s=document.getElementById('storemode');
  if(s) s.textContent = STORE.mode==='synced' ? 'Saving to your Claude account'
                      : STORE.mode==='device' ? 'Saving on this device only'
                      : 'Private browsing — nothing will save';
  document.querySelectorAll('[data-log]').forEach(i=>{
    const k=i.dataset.log;
    if(state.logs[k]!=null) i.value=state.logs[k];
    i.addEventListener('input',()=>{ state.logs[k]=i.value; save(); });
  });
  initData(); renderYoga(); renderLongRuns();
}
