<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car — Life hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEAE4; --card:#FBFAF7; --card2:#F2F0EA; --ink:#1B1E1A; --soft:#5F665D; --faint:#8C9289; --rule:#D6D3CA;
  --acc:#3F6B3A; --acc2:#B5782B; --big:#A8432F; --rest:#6F8FA8; --done:#E4EDE1; --shadow:0 1px 2px rgba(27,30,26,.06),0 4px 14px rgba(27,30,26,.05);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141613; --card:#1C1F1B; --card2:#232722; --ink:#E8EBE5; --soft:#A7AEA3; --faint:#7F867C; --rule:#323730;
  --acc:#7DB273; --acc2:#DDA35A; --big:#E07A63; --rest:#8FB0C9; --done:#1F2B1D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141613; --card:#1C1F1B; --card2:#232722; --ink:#E8EBE5; --soft:#A7AEA3; --faint:#7F867C; --rule:#323730;
  --acc:#7DB273; --acc2:#DDA35A; --big:#E07A63; --rest:#8FB0C9; --done:#1F2B1D; --shadow:none; color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.hidden{display:none!important}
.mods{display:flex;gap:6px;padding-top:16px;flex-wrap:wrap}
.mods span{font-size:12.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--rule);color:var(--faint)}
.mods span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hero{padding:22px 0 16px}
.hero .k{font-size:13px;color:var(--soft)}
.hero h1{margin:2px 0 0;font:700 clamp(40px,11vw,64px)/.9 'Barlow Condensed',sans-serif;letter-spacing:-.01em}
.dtype{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:3px;background:var(--card);border-left:3px solid var(--dc)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;font:600 18px 'Barlow Condensed',sans-serif;color:var(--soft);padding:12px 12px 9px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-top:14px;box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:14px 16px 0;font:700 23px/1.1 'Barlow Condensed',sans-serif}
.panel .pc{padding:8px 16px 14px}
.panel p{margin:6px 0}
.sub{font-size:13px;color:var(--soft)}
.meal{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.meal:first-of-type{border-top:0}
.slot{flex:0 0 74px;font:600 15px 'Barlow Condensed',sans-serif;color:var(--soft);padding-top:1px}
.mb b{display:block;font-size:15.5px}
.mb .d{font-size:13.5px;color:var(--soft)}
.mb .cook{font-size:12.5px;color:var(--acc2);font-weight:600;margin-top:3px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:12px;padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:600;white-space:nowrap}
tr.today td{background:var(--card2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dc);margin-right:6px;vertical-align:1px}
.sec{padding:10px 16px 2px;font:600 15px 'Barlow Condensed',sans-serif;color:var(--soft);border-top:1px solid var(--rule);display:flex;justify-content:space-between}
.sec:first-child{border-top:0}
.it{display:flex;align-items:center;gap:11px;padding:8px 16px}
.box{flex-shrink:0;width:24px;height:24px;border:1.5px solid var(--rule);border-radius:3px;background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0}
.box svg{width:14px;height:14px;opacity:0}
.it.on .box{background:var(--acc);border-color:var(--acc)}
.it.on .box svg{opacity:1}
.it .nm{flex:1;min-width:0}
.it .nm b{font-weight:600;font-size:14.5px}
.it .nm span{display:block;font-size:12.5px;color:var(--soft)}
.it.on .nm b{text-decoration:line-through;color:var(--soft)}
.eb{flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--acc);text-decoration:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;white-space:nowrap}
.need{flex-shrink:0;font-size:12px;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:3px 10px;cursor:pointer;color:var(--soft)}
.need[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc2);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--rule)}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.count{font-size:13px;color:var(--soft);margin-left:auto}
ul.steps{margin:6px 0;padding-left:18px}
ul.steps li{margin:5px 0}
.note{border-left:3px solid var(--acc2);padding:8px 12px;background:var(--card2);margin:10px 0;font-size:14px}
.foot{margin-top:24px;font-size:12.5px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:3px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
.hubnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 0;max-width:820px;margin:0 auto;font-family:'IBM Plex Sans',system-ui,sans-serif}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex-shrink:0;font-size:13px;font-weight:600;text-decoration:none;color:var(--soft);padding:5px 11px;border-radius:14px;border:1px solid var(--rule)}
.hubnav a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
<style>
.car{border-top:3px solid var(--cc)}
.car .meta{font-size:13px;color:var(--soft);padding:2px 16px 0}
.row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--rule)}
.row .nm{flex:1;min-width:0}.row .nm b{font-size:14.5px;font-weight:600}.row .nm span{display:block;font-size:12.5px;color:var(--soft)}
.pill{flex-shrink:0;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;background:var(--card2);color:var(--soft)}
.pill.r{background:var(--big);color:#fff}.pill.a{background:var(--acc2);color:#fff}.pill.g{background:var(--done);color:var(--acc)}
input.f{font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);min-width:0}
.kmrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px 12px}
.ed{display:none;gap:6px;flex-wrap:wrap;padding:0 16px 10px;align-items:center}
.ed.open{display:flex}
.lnk{background:none;border:0;color:var(--acc);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 0}
.lg{padding:9px 16px;border-top:1px solid var(--rule);font-size:13.5px}
.lg b{font-weight:600}.lg ul{margin:4px 0 0;padding-left:18px}.lg li{margin:2px 0}
.addf{display:grid;gap:7px;grid-template-columns:1fr 1fr;padding:8px 16px 12px}
.addf textarea{grid-column:1/-1;font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);min-height:70px}
.addf .btn{grid-column:1/-1;justify-self:start}
.ed.addf{display:none}.ed.addf.open{display:grid}
</style>
<link rel="stylesheet" href="../shared/theme.css?v=202610191754">
</head>
<body>
<nav class="hubnav" aria-label="Life hub"><a href="../">Life hub</a><a href="../training/">Training</a><a href="../meals/">Meals</a><a href="../holidays/">Holidays</a><a href="../car/" aria-current="page">Car</a><a href="../money/">Money</a><a href="../business/">Business</a></nav>
<div class="wrap">
  <header class="hero"><div class="k">Life hub</div><h1>Car</h1><div class="sub" id="sy"></div></header>
  <div class="panel"><h3>Next up</h3><div id="next"></div>
    <div class="bar"><button class="btn ghost" id="ics">Add dates to calendar (.ics)</button><span class="count" id="spent"></span></div></div>
  <div id="cars"></div>
  <div class="foot">Dates come from the "Моят автомобил" app. When you renew something, change its date here. Red: 14 days or less. Amber: 45 days or less.</div>
</div>
<div class="toast" id="toast"></div>
<script src="../shared/sync.js?v=202610191754"></script>
<script src="car-data.js?v=202610191754"></script>
<script>
let st=C_load();
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return d+' '+MN[m-1]+' '+y};
const nf=n=>n==null?'—':Number(n).toLocaleString('en-GB');
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)};
const pill=(days,kmLeft)=>{let cls='g',t;
  if(days==null&&kmLeft==null)return '<span class="pill">Not set</span>';
  const bad=(days!=null&&days<=14)||(kmLeft!=null&&kmLeft<=500), mid=(days!=null&&days<=45)||(kmLeft!=null&&kmLeft<=2000);
  cls=bad?'r':mid?'a':'g';
  const parts=[];if(days!=null)parts.push(days<0?Math.abs(days)+' d late':days+' d');if(kmLeft!=null)parts.push(kmLeft<0?nf(-kmLeft)+' km over':nf(kmLeft)+' km');
  return `<span class="pill ${cls}">${parts.join(' · ')}</span>`};
const co=id=>{st.cars=st.cars||{};return st.cars[id]=st.cars[id]||{}};
const save=m=>{C_save(st);render();if(m)toast(m)};
function render(){
  const cars=C_cars(st), up=C_upcoming(st).slice(0,5);
  document.getElementById('next').innerHTML=up.map(u=>`<div class="row"><span class="dot" style="--dc:${u.c}"></span><div class="nm"><b>${esc(u.n)}</b><span>${esc(u.car||'Both cars')} · ${fd(u.d)}${u.km?' or at '+nf(u.km)+' km':''}</span></div>${pill(C_days(u.d))}</div>`).join('');
  const y=String(new Date().getFullYear());let tot=0;cars.forEach(c=>c.log.forEach(l=>{if(l.d.slice(0,4)===y)l.items.forEach(i=>tot+=+i[1]||0)}));
  document.getElementById('spent').textContent='Spent on service in '+y+': '+tot+' €';
  document.getElementById('cars').innerHTML=cars.map(c=>`<div class="panel car" style="--cc:${c.c}">
   <h3>${esc(c.n)}</h3><div class="meta">${esc(c.sub)}</div>
   <div class="kmrow"><span class="sub">Km now:</span><b>${nf(c.km)}</b><span class="sub">${c.kmAt?'('+fd(c.kmAt)+')':''}</span>
     <input class="f" type="number" inputmode="numeric" placeholder="New km" data-km="${c.id}" style="width:110px"><button class="btn ghost" data-kms="${c.id}">Update</button></div>
   <div class="sec">Dates</div>
   ${c.dl.map(x=>`<div class="row"><div class="nm"><b>${esc(x.n)}</b><span>${x.d?'Until '+fd(x.d):esc(x.none||'No date')}${x.note?' · '+esc(x.note):''}</span></div>${x.d?pill(C_days(x.d)):'<span class="pill">None</span>'}<button class="lnk" data-op="dl-${c.id}-${x.id}">Edit</button></div>
     <div class="ed" id="dl-${c.id}-${x.id}"><span class="sub">New end date:</span><input class="f" type="date" value="${x.d||''}" data-dl="${c.id}|${x.id}"><button class="btn ghost" data-dls="${c.id}|${x.id}">Save</button></div>`).join('')}
   <div class="sec">Service</div>
   ${c.sv.map(s=>`<div class="row"><div class="nm"><b>${esc(s.n)}</b><span>${s.last?'Last: '+fd(s.last)+' at '+nf(s.lastKm)+' km · Next: '+fd(s.dueD)+' or '+nf(s.dueKm)+' km':'Last change not known. Enter it.'}</span><span>${esc(s.note)}</span></div>${pill(s.dLeft,s.kmLeft)}<button class="lnk" data-op="sv-${c.id}-${s.id}">Edit</button></div>
     <div class="ed" id="sv-${c.id}-${s.id}"><span class="sub">Last done:</span><input class="f" type="date" value="${s.last||''}" data-svd="${c.id}|${s.id}"><input class="f" type="number" inputmode="numeric" placeholder="km" value="${s.lastKm??''}" data-svk="${c.id}|${s.id}" style="width:100px"><button class="btn ghost" data-svs="${c.id}|${s.id}">Save</button></div>`).join('')}
   <div class="row"><div class="nm"><span>${esc(c.info)}</span></div></div>
   <div class="sec">Service log <button class="lnk" data-op="add-${c.id}">Add visit</button></div>
   <div class="ed addf" id="add-${c.id}" style="padding-top:8px">
     <input class="f" type="date" id="ad-${c.id}" value="${C_iso(new Date())}"><input class="f" type="number" inputmode="numeric" id="ak-${c.id}" placeholder="km">
     <textarea id="ai-${c.id}" placeholder="One job per line, cost at the end&#10;Oil, filters, labour 130&#10;Brake pads 80"></textarea>
     <button class="btn" data-add="${c.id}">Save visit</button></div>
   ${c.log.length?c.log.map(l=>`<div class="lg"><b>${fd(l.d)}</b> · ${nf(l.km)} km · ${l.items.reduce((a,i)=>a+(+i[1]||0),0)} €<ul>${l.items.map(i=>`<li>${esc(i[0])}${i[1]?' — '+i[1]+' €':''}</li>`).join('')}</ul></div>`).join(''):'<div class="lg sub">No visits logged yet.</div>'}
  </div>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.op){const el=document.getElementById(D.op);el.classList.toggle('open');return}
  if(D.kms){const v=parseInt(document.querySelector(`[data-km="${D.kms}"]`).value,10);if(!(v>0))return toast('Enter the km first');
    const o=co(D.kms);o.km=v;o.kmAt=C_iso(new Date());save('Km saved')}
  if(D.dls){const [c,id]=D.dls.split('|');const v=document.querySelector(`[data-dl="${D.dls}"]`).value;const o=co(c);o.dl=o.dl||{};o.dl[id]=v||null;save('Date saved')}
  if(D.svs){const [c,id]=D.svs.split('|');const d=document.querySelector(`[data-svd="${D.svs}"]`).value,k=parseInt(document.querySelector(`[data-svk="${D.svs}"]`).value,10);
    const o=co(c);o.sv=o.sv||{};o.sv[id]={last:d||null,lastKm:k>0?k:null};save('Service saved')}
  if(D.add){const c=D.add,d=document.getElementById('ad-'+c).value,k=parseInt(document.getElementById('ak-'+c).value,10);
    const items=document.getElementById('ai-'+c).value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)[\s—–-]*(\d+(?:[.,]\d+)?)\s*(?:€|eur|лв)?$/i);return m?[m[1].trim(),+m[2].replace(',','.')]:[x,0]});
    if(!d||!items.length)return toast('Add a date and at least one job');
    const o=co(c);o.log=o.log||[];o.log.push({d,km:k>0?k:null,items});
    if(k>0){const car=C_cars(st).find(x=>x.id===c);if(car.km==null||k>=car.km){o.km=k;o.kmAt=d}}
    save('Visit saved')}
  if(b.id==='ics'){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Life hub//Car//EN'];
    const nx=s=>{const [y,m,d]=s.split('-').map(Number);return C_iso(new Date(y,m-1,d+1)).replace(/-/g,'')};
    C_upcoming(st).forEach((u,i)=>{L.push('BEGIN:VEVENT','UID:lifehub-car-'+u.d+'-'+i+'@glukov','DTSTAMP:20261015T000000Z','DTSTART;VALUE=DATE:'+u.d.replace(/-/g,''),'DTEND;VALUE=DATE:'+nx(u.d),
      'SUMMARY:'+((u.car?u.car+': ':'')+u.n).replace(/[,;]/g,' '),'BEGIN:VALARM','TRIGGER:-P14D','ACTION:DISPLAY','DESCRIPTION:Car reminder','END:VALARM','END:VEVENT')});
    L.push('END:VCALENDAR');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='car-dates.ics';a.click()}
});
render();
HubSync.onStatus(t=>document.getElementById('sy').textContent=t);
HubSync.sync(C_KEY,localStorage.getItem(C_KEY)?st:null,d=>{st=d;localStorage.setItem(C_KEY,JSON.stringify(d));render()});
</script>
</body>
</html>
