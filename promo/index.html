<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#18201E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life hub">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<script src="../shared/auth.js?v=202610310101"></script>
<title>Promo codes — Life hub</title>
<style>
:root{
  --paper:#ECEAE4; --card:#FBFAF7; --card2:#F2F0EA; --ink:#1B1E1A; --soft:#5F665D; --faint:#8C9289; --rule:#D6D3CA;
  --acc:#3F6B3A; --acc2:#B5782B; --big:#A8432F; --sand:#E2D3BC; --shadow:0 1px 2px rgba(27,30,26,.06),0 4px 14px rgba(27,30,26,.05);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.hidden{display:none!important}
.hero{padding:22px 0 6px}
.hero .k{font-size:13px;color:var(--soft)}
.hero h1{margin:2px 0 0}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-top:14px;box-shadow:var(--shadow);padding:14px 16px}
.sub{font-size:13px;color:var(--soft)}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.go{display:flex;gap:8px;margin-top:14px}
.go .btn{flex:1;padding:14px;font-size:15px;text-align:center}
#cam{display:none}
form label{display:block;font-size:12.5px;color:var(--soft);margin-top:10px}
form input{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:rgba(255,255,255,.04);font-size:16px}
#fC{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .exp{font-size:12.5px;color:var(--faint);white-space:nowrap}
.card.soon .exp{color:var(--big);font-weight:600}
.card.expired{opacity:.5}
.card.expired .exp{text-decoration:line-through}
.code{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border:1px dashed var(--rule);border-radius:10px;background:rgba(255,255,255,.04);
  font:600 18px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.05em;cursor:pointer;word-break:break-all}
.pnote{margin:6px 0 0;font-size:13px;color:var(--soft)}
.acts{display:flex;gap:6px;margin-top:10px}
.old{margin-top:12px}
.empty{padding:28px 4px;text-align:center;color:var(--faint)}
.foot{margin-top:24px;font-size:12.5px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:3px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="../shared/theme.css?v=202610310101">
</head>
<body>
<div id="lhn"></div><script src="../shared/nav.js?v=202610310101"></script>
<div class="wrap">
  <header class="hero">
    <div class="k">Scan the card, keep the code</div>
    <h1>Promo codes</h1>
  </header>
  <div class="go">
    <label class="btn" for="cam">Scan a card</label>
    <button class="btn ghost" type="button" id="hand">Add by hand</button>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <form class="panel hidden" id="form" autocomplete="off">
    <div class="sub" id="fMsg"></div>
    <label for="fV">Shop</label><input id="fV" placeholder="Douglas">
    <label for="fC">Code</label><input id="fC" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="SAVE20">
    <label for="fE">Expires (last day it works; leave empty if none)</label><input id="fE" type="date">
    <label for="fN">Note</label><input id="fN" placeholder="20% off over €50">
    <div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="fCancel">Cancel</button></div>
  </form>
  <div id="list"></div>
  <div class="foot" id="store">Saved on this device</div>
</div>
<div class="toast" id="toast"></div>
<script src="../shared/sync.js?v=202610310101"></script>
<script src="app.js?v=202610310101"></script>
</body>
</html>
